# Channel-wide runtime policy for the video factory (spec v4).
#
# NOT wired into the runtime as of Phase 1A — no file under src/ reads this
# yet (see docs/spec-v4/IMPLEMENTATION-PLAN.md, Phase 1B). This file exists
# so the policy values are declared in one place ahead of that wiring.
#
# See docs/spec-v4/TECHNICAL-SPEC-EN.md and docs/adr/0001-spec-v4-authority.md
# for what each value means and why.

channel:
  language: "en-US"
  viewer_facing_language: "English"

budget:
  # $0/month incremental cost by default — every provider currently wired
  # (Groq, TokenRouter, Kokoro, Qwen-Image, Rhubarb, Manim, FFmpeg,
  # Real-ESRGAN) is free-tier or self-hosted.
  default_incremental_budget_usd: 0
  # A hard ceiling, NOT a budget available to spend automatically.
  emergency_monthly_ceiling_usd: 25
  paid_services_enabled: false
  automatic_payment_allowed: false
  explicit_user_approval_required: true

motion:
  # Google Flow stays optional; never required for a video to publish.
  manual_flow_required: false
  # Every video must be fully producible via the local/free pipeline alone.
  require_local_fallback_for_manual_flow: true
  # Veo is a paid Google service — stays disabled unless a paid-proposal
  # record for it is explicitly approved.
  veo_api_enabled: false

audio:
  background_music_enabled: false

timing:
  # Scene/video duration always comes from measured Kokoro output, never
  # from a word-count/wpm estimate.
  final_timing_source: "measured_audio"

visual:
  # On-screen text overlays are derived deterministically from manifest
  # data, not freely regenerated by an LLM per render.
  deterministic_text_overlays_enabled: true

character:
  # The character's appearance must stay consistent across every video on
  # the channel, not just within one video (see role-outfit.schema.json).
  identity_locked_across_channel: true
